name: qiraat_mushaf
description: "Mushaf (Hafs base) that overlays the differences of the ten qiraat."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.6
  http: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/data/
    # One file per riwaya; dropping a new <riwaya-id>.json here enables it.
    - assets/data/qiraat/

  fonts:
    # KFGQPC Uthmanic fonts, one per riwaya (each text uses its own glyphs).
    - family: Hafs
      fonts:
        - asset: assets/fonts/hafs.18.ttf
    - family: Warsh
      fonts:
        - asset: assets/fonts/warsh.10.ttf
    - family: Qaloon
      fonts:
        - asset: assets/fonts/qaloon.10.ttf
    - family: Bazzi
      fonts:
        - asset: assets/fonts/bazzi.7.ttf
    - family: Qumbul
      fonts:
        - asset: assets/fonts/qumbul.7.ttf
    - family: Doori
      fonts:
        - asset: assets/fonts/doori.9.ttf
    - family: Soosi
      fonts:
        - asset: assets/fonts/soosi.9.ttf
    - family: Shouba
      fonts:
        - asset: assets/fonts/shouba.8.ttf
