name: qiraat_mushaf
description: "Mushaf (Hafs base) that overlays the differences of the ten qiraat."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.6
  http: ^1.6.0
  camera: ^0.12.1
  google_mlkit_face_detection: ^0.15.1
  # Local copy with an Android build script for current tooling (see its build.gradle.kts).
  flutter_tesseract_ocr:
    path: third_party/flutter_tesseract_ocr
  path_provider: ^2.1.6
  image: ^4.12.0
  just_audio: ^0.10.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/data/
    # One file per riwaya; dropping a new <riwaya-id>.json here enables it.
    - assets/data/qiraat/
    # Offline tafsir books (tool/build_tafsir.dart).
    - assets/data/tafsir/
    # Tesseract Arabic model (tessdata_fast), to recognise a printed page.
    - assets/tessdata/
    - assets/tessdata_config.json
    # The app icon, shown on the start page (drawn by tool/icon).
    - assets/images/logo.png

  fonts:
    # KFGQPC Uthmanic Hafs font: the page, and every riwaya's readings in the
    # script of the Madinah mushaf (see madinahScript).
    - family: Hafs
      fonts:
        - asset: assets/fonts/hafs.18.ttf

# The app icon, «خُذِ ٱلۡكِتَٰبَ بِقُوَّةٖ»: drawn by tool/icon/render_icon_test.dart,
# installed with `dart run flutter_launcher_icons`.
flutter_launcher_icons:
  android: true
  ios: true
  image_path: tool/icon/icon.png
  adaptive_icon_background: "#1F5A40"
  adaptive_icon_foreground: tool/icon/foreground.png
  remove_alpha_ios: true

dependency_overrides:
  # 2.5.0 (Oct 2026) moved to JNI and fails at start on Android
  # (NoSuchMethodError: SharedPreferencesApiRegistrar.getAll): keep 2.4.x.
  shared_preferences_android: 2.4.28
